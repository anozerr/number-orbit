<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232427"/>
      <stop offset="0.48" stop-color="#17181A"/>
      <stop offset="1" stop-color="#0D0E10"/>
    </linearGradient>
    <linearGradient id="backgroundHighlight" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="orbit" x1="243.3" y1="243.3" x2="780.7" y2="780.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Match the 77 px transparent safe area used by the ICNS. -->
  <g transform="translate(77 77) scale(0.849609375)">
    <rect width="1024" height="1024" rx="250" fill="url(#background)"/>
    <rect x="2" y="2" width="1020" height="1020" rx="248"
          fill="url(#backgroundHighlight)"
          stroke="#38393C" stroke-width="4" stroke-opacity="0.55"/>

    <path d="M 801.3 432.4 A 300 300 0 1 1 591.6 222.7"
          fill="none"
          stroke="url(#orbit)"
          stroke-width="70"
          stroke-linecap="round"/>
    <circle cx="724.1" cy="299.9" r="80" fill="url(#orbit)"/>
  </g>
</svg>
